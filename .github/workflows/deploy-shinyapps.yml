name: Deploy to shinyapps.io

# Redéploie l'application à chaque push sur main qui modifie l'app ou ses dépendances.
# Secrets à créer dans Settings > Secrets and variables > Actions :
#   SHINYAPPS_NAME    nom du compte shinyapps.io
#   SHINYAPPS_TOKEN   token (shinyapps.io > Account > Tokens)
#   SHINYAPPS_SECRET  secret associé au token

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "renv.lock"
      - "tests/**"
      - ".github/workflows/deploy-shinyapps.yml"
  pull_request:
    paths:
      - "app/**"
      - "renv.lock"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: shinyapps-deploy
  cancel-in-progress: false

env:
  APP_NAME: chlordecone-simulation-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Test de fumée (chargement de app.R et modèles ODE)
        run: Rscript tests/smoke.R

  deploy:
    needs: test
    # Pas de déploiement depuis les pull requests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Deploy
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          for v in SHINYAPPS_NAME SHINYAPPS_TOKEN SHINYAPPS_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant"; exit 1; fi
          done
          Rscript -e '
            rsconnect::setAccountInfo(
              name   = Sys.getenv("SHINYAPPS_NAME"),
              token  = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            )
            rsconnect::deployApp(
              appDir      = "app",
              appFiles    = "app.R",
              appName     = Sys.getenv("APP_NAME"),
              account     = Sys.getenv("SHINYAPPS_NAME"),
              forceUpdate = TRUE,
              logLevel    = "verbose"
            )
          '
